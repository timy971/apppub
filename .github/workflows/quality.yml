name: Quality gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Tests, types, lint and builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Check TypeScript
        run: bun run typecheck

      - name: Run semantic lint gate
        run: bun run lint:ci

      - name: Build web application
        run: bun run build

      - name: Build Electron renderer
        run: bun run build:electron

  android-certification:
    name: Two signed Android releases
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4

      - name: Download pinned bundletool
        run: |
          mkdir -p "$RUNNER_TEMP/apppublisher-tools"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/apppublisher-tools/bundletool.jar" \
            https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar
          echo "378b5434cd1378bef6b2bc527b8c7f0ff2584b273830335bce54d6d0813c8584  $RUNNER_TEMP/apppublisher-tools/bundletool.jar" | sha256sum --check

      - name: Certify two consecutive AAB releases
        env:
          APPPUBLISHER_BUNDLETOOL_JAR: ${{ runner.temp }}/apppublisher-tools/bundletool.jar
        run: node scripts/certify-android-pipeline.cjs

      - name: Upload sanitized certification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-pipeline-certification
          path: .artifacts/android-certification/*.json
          if-no-files-found: warn
          retention-days: 14
