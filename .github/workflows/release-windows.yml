name: Release Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# macOS et Windows peuvent compléter la même release, mais jamais en parallèle.
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Sign, verify and publish
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Verify source
        run: |
          npm test
          npm run typecheck
          npm run lint:ci

      - name: Prepare private release files
        shell: pwsh
        env:
          GOOGLE_PLAY_OAUTH_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_OAUTH_JSON_BASE64 }}
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_AZURE_ENDPOINT: ${{ secrets.WINDOWS_AZURE_ENDPOINT }}
        run: |
          if (-not $env:GOOGLE_PLAY_OAUTH_JSON_BASE64) { throw "Secret Google OAuth absent" }
          if (-not $env:WINDOWS_CERTIFICATE_PFX_BASE64 -and -not $env:WINDOWS_AZURE_ENDPOINT) { throw "Signature Windows absente" }
          [IO.File]::WriteAllBytes("build/google-play-oauth.json", [Convert]::FromBase64String($env:GOOGLE_PLAY_OAUTH_JSON_BASE64))
          if ($env:WINDOWS_CERTIFICATE_PFX_BASE64) {
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/AppPublisher-signing.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          }

      - name: Build and verify the signed installer
        if: github.event_name == 'workflow_dispatch'
        env:
          CSC_LINK: ${{ runner.temp }}/AppPublisher-signing.pfx
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_AZURE_PUBLISHER_NAME: ${{ secrets.WINDOWS_AZURE_PUBLISHER_NAME }}
          WINDOWS_AZURE_ENDPOINT: ${{ secrets.WINDOWS_AZURE_ENDPOINT }}
          WINDOWS_AZURE_CERTIFICATE_PROFILE: ${{ secrets.WINDOWS_AZURE_CERTIFICATE_PROFILE }}
          WINDOWS_AZURE_SIGNING_ACCOUNT: ${{ secrets.WINDOWS_AZURE_SIGNING_ACCOUNT }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: npm run release:win

      - name: Build, verify and publish the signed installer
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CSC_LINK: ${{ runner.temp }}/AppPublisher-signing.pfx
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_AZURE_PUBLISHER_NAME: ${{ secrets.WINDOWS_AZURE_PUBLISHER_NAME }}
          WINDOWS_AZURE_ENDPOINT: ${{ secrets.WINDOWS_AZURE_ENDPOINT }}
          WINDOWS_AZURE_CERTIFICATE_PROFILE: ${{ secrets.WINDOWS_AZURE_CERTIFICATE_PROFILE }}
          WINDOWS_AZURE_SIGNING_ACCOUNT: ${{ secrets.WINDOWS_AZURE_SIGNING_ACCOUNT }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:win:publish

      - name: Keep artifacts for verification
        uses: actions/upload-artifact@v4
        with:
          name: AppPublisher-Windows
          path: |
            dist-app/AppPublisher-Setup.exe
            dist-app/AppPublisher-Setup.exe.blockmap
            dist-app/latest.yml
            .artifacts/windows-release-verification.json
          if-no-files-found: error
