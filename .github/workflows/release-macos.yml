name: Release macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Sign, notarize and publish
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify source
        run: |
          bun run test
          bun run typecheck
          bun run lint:ci

      - name: Prepare private release files
        env:
          GOOGLE_PLAY_OAUTH_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_OAUTH_JSON_BASE64 }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          test -n "$GOOGLE_PLAY_OAUTH_JSON_BASE64"
          test -n "$APPLE_API_KEY_BASE64"
          printf '%s' "$GOOGLE_PLAY_OAUTH_JSON_BASE64" | base64 -D > build/google-play-oauth.json
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 build/google-play-oauth.json "$RUNNER_TEMP/AuthKey.p8"

      - name: Build and publish the notarized release
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run release:mac:publish

      - name: Keep artifacts for verification
        uses: actions/upload-artifact@v4
        with:
          name: AppPublisher-macOS
          path: |
            dist-app/*.dmg
            dist-app/*.zip
            dist-app/latest-mac.yml
          if-no-files-found: error
